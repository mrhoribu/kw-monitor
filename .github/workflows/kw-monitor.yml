name: Kennedy-Warren monitor

on:
  workflow_dispatch:
#  schedule:
#    - cron: '23,53 * * * *'   # every 30mins

permissions:
  contents: write   # needed to commit state.json back

# Never run two checks at once: overlapping runs would race on the state.json push.
concurrency:
  group: kw-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Stdlib-only script; uses the runner's preinstalled python3.
      - id: check
        env:
          WATCH_LIST: 'Historic 01,Historic 02,Historic 14,Historic 27'   # comma-separate for multiple
        run: python3 monitor.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-response
          path: debug/
          retention-days: 1
          if-no-files-found: ignore   # empty when the site never responded

      - if: steps.check.outputs.hit == 'true'
        name: Discord notify
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MATCHES: ${{ steps.check.outputs.matches }}
          ALL: ${{ steps.check.outputs.all_matching }}
        run: |
          jq -n --arg m "$MATCHES" --arg all "${ALL:-none}" --arg run "$GITHUB_RUN_ID" '{
            username: "Kennedy-Warren Monitor",
            embeds: [{
              title: "🏠 New availability: \($m)",
              url: "https://kennedywarren.com/floorplans/",
              color: 3066993,
              fields: [
                {name: "Newly available", value: $m, inline: false},
                {name: "All currently matching", value: $all, inline: false}
              ],
              footer: {text: "Run \($run)"}
            }]
          }' | curl --fail-with-body -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @-

      - if: steps.check.outputs.hit == 'true'
        name: Resend email notify
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.RESEND_FROM }}
          MAIL_TO: ${{ secrets.RESEND_TO }}          # comma-separated: a@x.com,b@y.com
          MATCHES: ${{ steps.check.outputs.matches }}
          ALL: ${{ steps.check.outputs.all_matching }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg from "$MAIL_FROM" --arg to "$MAIL_TO" --arg m "$MATCHES" \
                --arg all "${ALL:-none}" --arg run "$RUN_URL" '{
            from: $from,
            to: ($to | split(",") | map(gsub("^ +| +$"; ""))),
            subject: "🏠 Kennedy-Warren: \($m) available",
            html: "<h2>New floorplan availability</h2><p><strong>Newly available:</strong> \($m)</p><p><strong>All currently matching:</strong> \($all)</p><p><a href=\"https://kennedywarren.com/floorplans/\">View floorplans</a> · <a href=\"\($run)\">Workflow run</a></p>"
          }' | curl --fail-with-body -X POST https://api.resend.com/emails \
                 -H "Authorization: Bearer $RESEND_API_KEY" \
                 -H "Content-Type: application/json" \
                 -d @-

      - name: Commit state.json
        run: |
          git diff --quiet -- state.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "state: update floorplan availability" -- state.json
          git push

      - name: Report job failure to Discord
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          jq -n --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{username: "KW Monitor (alert)", content: "⚠️ Workflow failed: \($url)"}' \
          | curl --fail-with-body -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @-
